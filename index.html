<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>چت جمنای</title>
<style>
  :root{
    --bg:#0f1419; --panel:#171e26; --line:#26313d; --text:#e8edf2; --mute:#8b98a5;
    --me:#2b5fd9; --bot:#1e2731; --accent:#4f8cff; --danger:#e5484d;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg);color:var(--text);
    font-family:Tahoma,"Segoe UI",system-ui,sans-serif;font-size:16px;
    display:flex;flex-direction:column;
    padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);
  }
  header{
    display:flex;align-items:center;gap:6px;padding:10px 12px;
    background:var(--panel);border-bottom:1px solid var(--line);
  }
  header h1{flex:1;margin:0;font-size:16px;font-weight:600;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ib{background:none;border:0;color:var(--text);font-size:20px;
    width:40px;height:40px;border-radius:10px;cursor:pointer}
  .ib:active{background:var(--line)}
  .ib.rec{background:var(--danger)}
  #msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
  .b{max-width:88%;padding:10px 13px;border-radius:14px;line-height:1.9;
    word-wrap:break-word;overflow-wrap:anywhere}
  .b.user{align-self:flex-start;background:var(--me);border-bottom-right-radius:4px}
  .b.model{align-self:flex-end;background:var(--bot);border-bottom-left-radius:4px;border:1px solid var(--line)}
  .b.err{align-self:center;background:#3a1a1c;border:1px solid var(--danger);font-size:14px;direction:ltr;text-align:left}
  .b pre{direction:ltr;text-align:left;background:#0a0e12;padding:10px;border-radius:8px;
    overflow-x:auto;margin:8px 0;font-size:13px;line-height:1.5;white-space:pre}
  .b code{direction:ltr;unicode-bidi:embed;background:#0a0e12;padding:1px 5px;border-radius:5px;font-size:13px}
  .b pre code{background:none;padding:0}
  .empty{margin:auto;text-align:center;color:var(--mute);line-height:2}
  #chip{display:none;margin:0 12px 6px;padding:6px 10px;background:var(--panel);
    border:1px solid var(--line);border-radius:10px;font-size:14px;align-items:center;gap:8px}
  #chip span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #chip button{background:none;border:0;color:var(--danger);font-size:18px;cursor:pointer}
  .bar{display:flex;gap:6px;align-items:flex-end;padding:8px 10px;
    background:var(--panel);border-top:1px solid var(--line)}
  textarea{flex:1;resize:none;max-height:140px;min-height:42px;padding:10px 12px;
    background:var(--bg);color:var(--text);border:1px solid var(--line);
    border-radius:12px;font:inherit;line-height:1.6;outline:none}
  textarea:focus{border-color:var(--accent)}
  #send{background:var(--accent);color:#fff;border:0;width:44px;height:44px;
    border-radius:12px;font-size:20px;cursor:pointer}
  #send:disabled{opacity:.5}
  /* کشوی چت‌ها و تنظیمات */
  .ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:10}
  .ov.on{display:flex}
  .sheet{background:var(--panel);width:min(88vw,360px);height:100%;
    display:flex;flex-direction:column;border-left:1px solid var(--line)}
  .sheet h2{margin:0;padding:14px;font-size:16px;border-bottom:1px solid var(--line)}
  .list{flex:1;overflow-y:auto;padding:8px}
  .row{display:flex;align-items:center;gap:6px;padding:10px;border-radius:10px;cursor:pointer}
  .row.on{background:var(--line)}
  .row span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row button{background:none;border:0;color:var(--mute);font-size:18px;cursor:pointer}
  .btn{margin:10px;padding:12px;border:0;border-radius:10px;background:var(--accent);
    color:#fff;font:inherit;cursor:pointer}
  .btn.gray{background:var(--line)}
  .form{padding:14px;display:flex;flex-direction:column;gap:6px;overflow-y:auto}
  .form label{font-size:14px;color:var(--mute);margin-top:8px}
  .form input{padding:10px;background:var(--bg);color:var(--text);border:1px solid var(--line);
    border-radius:10px;font:inherit;direction:ltr;text-align:left;outline:none}
  .form small{color:var(--mute);line-height:1.8}
  .form{flex:1}
  .form select{padding:10px;background:var(--bg);color:var(--text);border:1px solid var(--line);
    border-radius:10px;font:inherit;direction:ltr;text-align:left;outline:none}
  .live{width:100%;height:100%;background:var(--bg);display:flex;flex-direction:column;
    padding-top:env(safe-area-inset-top)}
  .lhead{display:flex;align-items:center;gap:6px;padding:10px 12px;background:var(--panel);
    border-bottom:1px solid var(--line)}
  .lhead b{flex:1}
  #liveStat{padding:10px 14px;color:var(--mute);font-size:14px;text-align:center;line-height:1.8;white-space:pre-line}
  #liveLog{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:10px}
  .lbar{display:flex;gap:10px;padding:14px;justify-content:center;background:var(--panel);
    border-top:1px solid var(--line);padding-bottom:calc(14px + env(safe-area-inset-bottom))}
  .lbtn{flex:1;max-width:220px;padding:14px;border:0;border-radius:14px;font:inherit;
    font-size:17px;color:#fff;background:var(--accent);cursor:pointer}
  .lbtn.stop{background:var(--danger)}
  .lbtn.gray{background:var(--line)}
  .lbtn:disabled{opacity:.5}
</style>
</head>
<body>

<header>
  <button class="ib" id="bMenu" title="چت‌ها">☰</button>
  <h1 id="ttl">چت جمنای</h1>
  <button class="ib" id="bNew" title="چت جدید">➕</button>
  <button class="ib" id="bLive" title="گفتگوی صوتی زنده">📞</button>
  <button class="ib" id="bSet" title="تنظیمات">⚙️</button>
</header>

<div id="msgs"></div>

<div id="chip"><span id="chipTxt"></span><button id="chipX">✕</button></div>

<div class="bar">
  <button class="ib" id="bAtt" title="پیوست">📎</button>
  <button class="ib" id="bMic" title="ضبط صدا">🎤</button>
  <textarea id="inp" rows="1" placeholder="پیامت رو بنویس..."></textarea>
  <button id="send">➤</button>
</div>
<input type="file" id="file" hidden accept="image/*,application/pdf,text/plain,audio/*">

<!-- لیست چت‌ها -->
<div class="ov" id="ovList">
  <div class="sheet">
    <h2>چت‌های من</h2>
    <div class="list" id="list"></div>
    <button class="btn" id="listNew">➕ چت جدید</button>
  </div>
</div>

<!-- تنظیمات -->
<div class="ov" id="ovSet">
  <div class="sheet">
    <h2>تنظیمات</h2>
    <div class="form">
      <label>کلید Gemini</label>
      <input id="fKey" type="password" placeholder="AIza..." autocomplete="off">
      <label>مدل چت متنی</label>
      <select id="fModel">
        <option value="gemini-3.5-flash-lite">gemini-3.5-flash-lite (پیش‌فرض)</option>
        <option value="gemini-3.1-flash-lite">gemini-3.1-flash-lite (جایگزین)</option>
      </select>
      <label>مدل گفتگوی صوتی زنده</label>
      <select id="fLive">
        <option value="gemini-3.8-live">gemini-3.8-live</option>
        <option value="gemini-3.1-flash-live-preview">gemini-3.1-flash-live-preview</option>
      </select>
      <label>گوینده‌ی صدا</label>
      <select id="fVoice"></select>
      <label>آدرس سرور اصلی</label>
      <input id="fBase">
      <label>آدرس جایگزین (پل)</label>
      <input id="fBase2" placeholder="https://...workers.dev">
      <small>مدل چت متنی از پیام بعدی عوض می‌شه. مدل و گوینده‌ی صوتی از دفعه‌ی بعدی که گفتگوی زنده رو شروع کنی اعمال می‌شه.</small>
      <small>کلید فقط توی همین مرورگر روی گوشی خودت ذخیره می‌شه و جایی فرستاده نمی‌شه، جز خود سرور گوگل.</small>
    </div>
    <button class="btn" id="setSave">ذخیره</button>
    <button class="btn gray" id="setClose">بستن</button>
  </div>
</div>

<!-- گفتگوی صوتی زنده -->
<div class="ov" id="ovLive">
  <div class="live">
    <div class="lhead"><b>📞 گفتگوی صوتی زنده</b><button class="ib" id="liveClose">✕</button></div>
    <div id="liveStat">آماده. دکمه‌ی شروع رو بزن.</div>
    <div id="liveLog"></div>
    <div class="lbar">
      <button class="lbtn" id="liveBtn">🎙️ شروع</button>
      <button class="lbtn gray" id="liveMute" style="display:none">🔇 بی‌صدا</button>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
const DEFAULT_MODEL = 'gemini-3.5-flash-lite';
const DEFAULT_BASE  = 'https://generativelanguage.googleapis.com';
const MAX_FILE  = 4 * 1024 * 1024;   // ۴ مگابایت
const MAX_KEEP  = 16;                // تعداد پیام نگه‌داشته‌شده در هر چت
const MAX_CHATS = 20;

// ---------- ذخیره‌سازی ----------
const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
let data = store.get('gc_data', null);
if (!data || !data.sessions) data = { active: null, sessions: {} };
const DEFAULT_BASE2 = 'https://gemini.maximiloo90.workers.dev';
const savedCfg = store.get('gc_cfg', {});
let cfg = Object.assign({ key:'', model:DEFAULT_MODEL, base:DEFAULT_BASE, base2:DEFAULT_BASE2,
  liveModel:'gemini-3.8-live', voice:'Zephyr' }, savedCfg);
if (!('base2' in savedCfg)) { cfg.base = DEFAULT_BASE; cfg.base2 = DEFAULT_BASE2; store.set('gc_cfg', cfg); }
let pending = null, busy = false;

const save = () => store.set('gc_data', data);

function newChat(){
  const id = Date.now().toString(36);
  data.sessions[id] = { id, created: Date.now(), title: 'گفتگوی جدید', messages: [] };
  data.active = id;
  const ids = Object.values(data.sessions).sort((a,b)=>a.created-b.created).map(s=>s.id);
  while (ids.length > MAX_CHATS){ delete data.sessions[ids.shift()]; }
  save();
}
if (!data.active || !data.sessions[data.active]) {
  const ids = Object.keys(data.sessions);
  if (ids.length) data.active = ids[ids.length-1]; else newChat();
}
const cur = () => data.sessions[data.active];

// ---------- نمایش ----------
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmt(t){
  let h = esc(t);
  h = h.replace(/```(?:\w+)?\n?([\s\S]*?)```/g, (m,c)=>`<pre><code>${c}</code></pre>`);
  h = h.replace(/`([^`\n]+)`/g, '<code>$1</code>');
  h = h.replace(/\*\*([^*\n]+)\*\*/g, '<b>$1</b>');
  h = h.replace(/(<\/pre>)\n/g,'$1').replace(/\n(<pre>)/g,'$1');
  return h.replace(/\n/g, '<br>').replace(/<pre>([\s\S]*?)<\/pre>/g,(m)=>m.replace(/<br>/g,'\n'));
}
function bubble(role, text){
  const d = document.createElement('div');
  d.className = 'b ' + role;
  d.innerHTML = fmt(text);
  $('msgs').appendChild(d);
  $('msgs').scrollTop = $('msgs').scrollHeight;
  return d;
}
function renderChat(){
  const box = $('msgs'); box.innerHTML = '';
  const s = cur();
  $('ttl').textContent = s.title;
  if (!s.messages.length){
    box.innerHTML = '<div class="empty">سلام 👋<br>یه پیام بنویس یا فایل بفرست.</div>';
    return;
  }
  s.messages.forEach(m => bubble(m.role, m.text));
}
function renderList(){
  const l = $('list'); l.innerHTML = '';
  Object.values(data.sessions).sort((a,b)=>b.created-a.created).forEach(s=>{
    const r = document.createElement('div');
    r.className = 'row' + (s.id === data.active ? ' on' : '');
    r.innerHTML = `<span>${s.id===data.active?'✅':'💬'} ${esc(s.title)}</span><button>🗑</button>`;
    r.querySelector('span').onclick = ()=>{ data.active = s.id; save(); renderChat(); closeAll(); };
    r.querySelector('button').onclick = e=>{
      e.stopPropagation();
      delete data.sessions[s.id];
      if (!Object.keys(data.sessions).length) newChat();
      else if (data.active === s.id) data.active = Object.keys(data.sessions)[0];
      save(); renderList(); renderChat();
    };
    l.appendChild(r);
  });
}
function closeAll(){ stopLive(); document.querySelectorAll('.ov').forEach(o=>o.classList.remove('on')); }

// ---------- تاریخ و ساعت ----------
function dateInfo(){
  const now = new Date(), tz = 'Asia/Tehran';
  const g = new Intl.DateTimeFormat('en-US',{timeZone:tz,year:'numeric',month:'2-digit',day:'2-digit',
    hour:'2-digit',minute:'2-digit',second:'2-digit',hour12:false}).format(now);
  const j = new Intl.DateTimeFormat('fa-IR-u-ca-persian',{timeZone:tz,year:'numeric',month:'2-digit',
    day:'2-digit',weekday:'long'}).format(now);
  return `زمان و تقویم سیستم:\n- شمسی: ${j}\n- میلادی: ${g}`;
}

// ---------- پیوست ----------
function toB64(file){
  return new Promise((ok,bad)=>{
    const r = new FileReader();
    r.onload = ()=>ok(String(r.result).split(',')[1]);
    r.onerror = ()=>bad(new Error('خواندن فایل نشد'));
    r.readAsDataURL(file);
  });
}
$('bAtt').onclick = ()=>$('file').click();
$('file').onchange = async e=>{
  const f = e.target.files[0]; e.target.value = '';
  if (!f || rec) return;
  if (f.size > MAX_FILE){ bubble('err','حجم فایل باید کمتر از ۴ مگابایت باشه.'); return; }
  const t = f.type || '';
  try{
    if (t === 'text/plain') pending = { kind:'text', text: await f.text(), label:'📄 '+f.name };
    else if (t === 'application/pdf' || t.startsWith('image/') || t.startsWith('audio/'))
      pending = { kind:'bin', mime:t, data: await toB64(f), label:'📎 '+f.name };
    else { bubble('err','فقط عکس، PDF، متن ساده و صدا پشتیبانی می‌شه.'); return; }
    $('chipTxt').textContent = pending.label;
    $('chip').style.display = 'flex';
  }catch(err){ bubble('err', err.message); }
};
$('chipX').onclick = ()=>{
  if (rec){ rec.cancel = true; stopRec(); return; }
  pending = null; $('chip').style.display = 'none';
};

// ---------- ضبط صدا ----------
let rec = null;
function fmtT(s){ return Math.floor(s/60) + ':' + String(s%60).padStart(2,'0'); }
function bufToB64(buf){
  const b = new Uint8Array(buf); let s = '';
  for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000));
  return btoa(s);
}
function wavFromPCM(f32, rate){
  const n = f32.length, out = new ArrayBuffer(44 + n*2), v = new DataView(out);
  const w = (o,t)=>{ for (let i=0;i<t.length;i++) v.setUint8(o+i, t.charCodeAt(i)); };
  w(0,'RIFF'); v.setUint32(4, 36 + n*2, true); w(8,'WAVE'); w(12,'fmt ');
  v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,rate,true); v.setUint32(28,rate*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true);
  w(36,'data'); v.setUint32(40, n*2, true);
  for (let i=0;i<n;i++){
    const x = Math.max(-1, Math.min(1, f32[i]));
    v.setInt16(44 + i*2, x < 0 ? x*0x8000 : x*0x7FFF, true);
  }
  return out;
}
async function toWav16k(blob){
  const arr = await blob.arrayBuffer();
  const AC = window.AudioContext || window.webkitAudioContext;
  const ac = new AC();
  const buf = await new Promise((ok,bad)=>ac.decodeAudioData(arr, ok, bad));
  ac.close();
  const off = new OfflineAudioContext(1, Math.max(1, Math.ceil(buf.duration*16000)), 16000);
  const src = off.createBufferSource(); src.buffer = buf; src.connect(off.destination); src.start();
  const r = await off.startRendering();
  return { wav: wavFromPCM(r.getChannelData(0), 16000), sec: Math.round(buf.duration) };
}
async function startRec(){
  if (busy) return;
  if (!navigator.mediaDevices || !window.MediaRecorder){
    bubble('err','این مرورگر ضبط صدا رو پشتیبانی نمی‌کنه.'); return;
  }
  let stream;
  try{ stream = await navigator.mediaDevices.getUserMedia({ audio:true }); }
  catch(e){ bubble('err','اجازه‌ی میکروفن داده نشد. از تنظیمات مرورگر اجازه بده.'); return; }
  const mr = new MediaRecorder(stream);
  rec = { mr, chunks:[], stream, t0:Date.now(), cancel:false, timer:null };
  mr.ondataavailable = e=>{ if (e.data && e.data.size) rec.chunks.push(e.data); };
  mr.onstop = onRecStop;
  mr.start();
  pending = null;
  $('bMic').classList.add('rec'); $('bMic').textContent = '⏹';
  $('chip').style.display = 'flex';
  $('chipTxt').textContent = '🔴 در حال ضبط... 0:00';
  rec.timer = setInterval(()=>{
    const s = Math.floor((Date.now() - rec.t0) / 1000);
    $('chipTxt').textContent = '🔴 در حال ضبط... ' + fmtT(s);
    if (s >= 120) stopRec();   // حداکثر ۲ دقیقه
  }, 250);
}
function stopRec(){ if (rec && rec.mr.state !== 'inactive') rec.mr.stop(); }
async function onRecStop(){
  const r = rec;
  clearInterval(r.timer);
  r.stream.getTracks().forEach(t=>t.stop());
  $('bMic').classList.remove('rec'); $('bMic').textContent = '🎤';
  rec = null;
  if (r.cancel){ $('chip').style.display = 'none'; return; }
  $('chipTxt').textContent = '⏳ در حال آماده‌سازی...';
  try{
    const blob = new Blob(r.chunks, { type: r.mr.mimeType || 'audio/webm' });
    if (blob.size < 500) throw new Error('ضبط خیلی کوتاه بود.');
    const { wav, sec } = await toWav16k(blob);
    if (wav.byteLength > MAX_FILE) throw new Error('ضبط خیلی طولانیه.');
    pending = { kind:'bin', mime:'audio/wav', data: bufToB64(wav), label:'🎤 صدای ضبط‌شده (' + fmtT(sec) + ')' };
    $('chipTxt').textContent = pending.label;
  }catch(err){
    $('chip').style.display = 'none';
    bubble('err', 'ضبط صدا آماده نشد: ' + err.message);
  }
}
$('bMic').onclick = ()=>{ rec ? stopRec() : startRec(); };

// ---------- تماس با Gemini (اول مسیر مستقیم، اگه نشد پل) ----------
async function callGemini(body){
  const bases = [...new Set([cfg.base, cfg.base2].map(b => (b||'').trim().replace(/\/+$/,'')).filter(Boolean))];
  let lastErr = new Error('آدرس سرور خالیه');
  for (let i = 0; i < bases.length; i++){
    const ctl = new AbortController();
    const tm = setTimeout(()=>ctl.abort(), 60000);
    try{
      const res = await fetch(`${bases[i]}/v1beta/models/${cfg.model}:generateContent`, {
        method:'POST', signal: ctl.signal,
        headers:{ 'Content-Type':'application/json', 'x-goog-api-key': cfg.key },
        body
      });
      clearTimeout(tm);
      if (res.status >= 500 && i < bases.length - 1){ lastErr = new Error('خطای سرور ' + res.status); continue; }
      return res;
    }catch(e){
      clearTimeout(tm);
      lastErr = e;
    }
  }
  throw lastErr;
}

// ---------- ارسال ----------
async function send(){
  if (busy || rec) return;
  const text = $('inp').value.trim();
  if (!text && !pending) return;
  if (!cfg.key){ openSet(); return; }

  const s = cur();
  const parts = [];
  if (pending){
    if (pending.kind === 'text') parts.push({ text:`[متن فایل ارسالی:\n${pending.text}]` });
    else parts.push({ inlineData:{ mimeType:pending.mime, data:pending.data } });
  }
  if (text) parts.push({ text });

  const shown = text || pending.label;
  const summary = text || (pending.mime && pending.mime.startsWith('image/') ? '[تصویر]'
                  : pending.mime && pending.mime.startsWith('audio/') ? '[صدا]' : '[فایل]');
  if (!s.messages.length) s.title = (text || 'گفتگوی چندرسانه‌ای').substring(0,25);

  if ($('msgs').querySelector('.empty')) $('msgs').innerHTML = '';
  bubble('user', shown);
  $('inp').value = ''; $('inp').style.height = 'auto';
  pending = null; $('chip').style.display = 'none';
  $('ttl').textContent = s.title;

  const wait = bubble('model', '⏳ دارم می‌نویسم...');
  busy = true; $('send').disabled = true;

  const contents = s.messages.map(m=>({ role:m.role, parts:[{text:m.text}] }));
  contents.push({ role:'user', parts });

  try{
    const res = await callGemini(JSON.stringify({
      systemInstruction:{ parts:[{ text:`تو یک دستیار هوشمند، دقیق و مؤدب هستی.\n${dateInfo()}` }] },
      contents
    }));
    if (!res.ok){
      const t = await res.text();
      wait.remove();
      bubble('err', 'خطا از سمت گوگل:\n' + t.substring(0,400));
      return;
    }
    const j = await res.json();
    let out = '';
    if (j.candidates && j.candidates.length && j.candidates[0].content)
      out = j.candidates[0].content.parts.map(p=>p.text||'').join('');
    else if (j.promptFeedback) out = 'پاسخ توسط فیلترهای ایمنی گوگل مسدود شد.';
    else out = 'پاسخی از مدل نرسید.';

    wait.innerHTML = fmt(out);
    s.messages.push({ role:'user', text:summary }, { role:'model', text:out });
    if (s.messages.length > MAX_KEEP) s.messages = s.messages.slice(-MAX_KEEP);
    save();
  }catch(err){
    wait.remove();
    bubble('err', 'اتصال برقرار نشد. اینترنت یا آدرس سرور رو چک کن.\n' + err.message);
  }finally{
    busy = false; $('send').disabled = false;
    $('msgs').scrollTop = $('msgs').scrollHeight;
  }
}

document.querySelectorAll('.ov').forEach(o=>o.addEventListener('click', e=>{ if (e.target === o) closeAll(); }));


// ====================== گفتگوی صوتی زنده ======================
const LIVE_MODELS = ['gemini-3.8-live', 'gemini-3.1-flash-live-preview'];
const VOICES = [
  ['Zephyr','روشن'],['Puck','سرحال'],['Charon','آموزنده'],['Kore','محکم'],['Fenrir','پرشور'],
  ['Leda','جوان'],['Orus','محکم'],['Aoede','سبک'],['Callirrhoe','راحت'],['Autonoe','روشن'],
  ['Enceladus','نفس‌دار'],['Iapetus','شفاف'],['Umbriel','راحت'],['Algieba','نرم'],['Despina','نرم'],
  ['Erinome','شفاف'],['Algenib','خش‌دار'],['Rasalgethi','آموزنده'],['Laomedeia','سرحال'],
  ['Achernar','ملایم'],['Alnilam','محکم'],['Schedar','یکنواخت'],['Gacrux','باتجربه'],
  ['Pulcherrima','قاطع'],['Achird','دوستانه'],['Zubenelgenubi','خودمونی'],['Vindemiatrix','آرام'],
  ['Sadachbia','پرجنب‌وجوش'],['Sadaltager','دانا'],['Sulafat','گرم']
];
function ensureOpt(sel, val){
  if (!val) return;
  if (![...sel.options].some(o => o.value === val)){
    const o = document.createElement('option'); o.value = val; o.textContent = val; sel.appendChild(o);
  }
}
VOICES.forEach(([n, d])=>{
  const o = document.createElement('option'); o.value = n; o.textContent = n + ' — ' + d;
  $('fVoice').appendChild(o);
});

let live = null;
let liveBusy = false;

function liveStatus(t){ $('liveStat').textContent = t; }
function f32ToI16(f){
  const o = new Int16Array(f.length);
  for (let i = 0; i < f.length; i++){
    const x = Math.max(-1, Math.min(1, f[i]));
    o[i] = x < 0 ? x * 0x8000 : x * 0x7FFF;
  }
  return o;
}
function downsample(f, inRate, outRate){
  if (inRate === outRate) return f;
  const ratio = inRate / outRate, n = Math.floor(f.length / ratio), o = new Float32Array(n);
  for (let i = 0; i < n; i++){
    const a = Math.floor(i * ratio), b = Math.min(f.length, Math.floor((i + 1) * ratio));
    let sum = 0; for (let j = a; j < b; j++) sum += f[j];
    o[i] = sum / Math.max(1, b - a);
  }
  return o;
}
async function parseMsg(d){
  try{
    if (typeof d !== 'string') d = await d.text();
    return JSON.parse(d);
  }catch(e){ return null; }
}
function setupMsg(model){
  return { setup: {
    model: 'models/' + model,
    generationConfig: {
      responseModalities: ['AUDIO'],
      speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: cfg.voice } } }
    },
    systemInstruction: { parts: [{ text: 'تو یک دستیار صوتی هوشمند، دقیق و مؤدب هستی. کوتاه و روان جواب بده.\n' + dateInfo() }] },
    inputAudioTranscription: {},
    outputAudioTranscription: {}
  }};
}
function connectOnce(base, model){
  return new Promise((ok, bad)=>{
    let opened = false, done = false, ws;
    const url = base.replace(/^http/, 'ws').replace(/\/+$/, '') +
      '/ws/google.ai.generativelanguage.v1beta.GenerativeService.BidiGenerateContent?key=' + encodeURIComponent(cfg.key);
    try{ ws = new WebSocket(url); }catch(e){ return bad({ kind:'net', msg:e.message }); }
    const fail = (kind, msg)=>{
      if (done) return; done = true; clearTimeout(tm);
      try{ ws.close(); }catch(e){}
      bad({ kind, msg });
    };
    const tm = setTimeout(()=>fail(opened ? 'setup' : 'net', 'زمان اتصال تموم شد'), 10000);
    ws.onopen = ()=>{ opened = true; ws.send(JSON.stringify(setupMsg(model))); };
    ws.onerror = ()=>fail(opened ? 'setup' : 'net', 'اتصال برقرار نشد');
    ws.onclose = e=>fail(opened ? 'setup' : 'net', e.reason || ('اتصال بسته شد (' + e.code + ')'));
    ws.onmessage = async ev=>{
      const m = await parseMsg(ev.data);
      if (m && m.setupComplete && !done){ done = true; clearTimeout(tm); ok(ws); }
    };
  });
}

function liveAppend(kind, text){
  if (!live) return;
  const key = kind === 'in' ? 'curIn' : 'curOut';
  if (!live[key]){
    const d = document.createElement('div');
    d.className = 'b ' + (kind === 'in' ? 'user' : 'model');
    $('liveLog').appendChild(d); live[key] = d;
  }
  live[key].textContent += text;
  $('liveLog').scrollTop = $('liveLog').scrollHeight;
}
function playPcm(b64){
  const L = live; if (!L) return;
  const bin = atob(b64), n = bin.length >> 1;
  const buf = L.ctxOut.createBuffer(1, n, 24000), ch = buf.getChannelData(0);
  for (let i = 0; i < n; i++){
    let v = bin.charCodeAt(2*i) | (bin.charCodeAt(2*i + 1) << 8);
    if (v >= 0x8000) v -= 0x10000;
    ch[i] = v / 32768;
  }
  const src = L.ctxOut.createBufferSource();
  src.buffer = buf; src.connect(L.ctxOut.destination);
  const t = Math.max(L.ctxOut.currentTime + 0.02, L.nextT);
  src.start(t); L.nextT = t + buf.duration;
  L.sources.add(src); src.onended = ()=>L.sources.delete(src);
}
function stopPlayback(){
  if (!live) return;
  live.sources.forEach(s=>{ try{ s.stop(); }catch(e){} });
  live.sources.clear(); live.nextT = 0;
}
function handleLive(m){
  const sc = m.serverContent;
  if (sc){
    if (sc.interrupted) stopPlayback();
    const parts = sc.modelTurn && sc.modelTurn.parts;
    if (parts) for (const p of parts){
      if (p.inlineData && p.inlineData.data){ playPcm(p.inlineData.data); liveStatus('🔊 داره جواب می‌ده...'); }
    }
    if (sc.inputTranscription && sc.inputTranscription.text) liveAppend('in', sc.inputTranscription.text);
    if (sc.outputTranscription && sc.outputTranscription.text) liveAppend('out', sc.outputTranscription.text);
    if (sc.turnComplete && live){ live.curIn = null; live.curOut = null; liveStatus('🟢 گوش می‌دم...'); }
  }
  if (m.goAway) liveStatus('⚠️ سرور به‌زودی اتصال رو قطع می‌کنه.');
}
function resetLiveUi(){
  $('liveBtn').textContent = '🎙️ شروع'; $('liveBtn').classList.remove('stop'); $('liveBtn').disabled = false;
  $('liveMute').style.display = 'none'; $('liveMute').textContent = '🔇 بی‌صدا';
}
function stopLive(note){
  const L = live; live = null;
  if (L){
    try{ L.proc.disconnect(); L.src.disconnect(); }catch(e){}
    try{ L.stream.getTracks().forEach(t=>t.stop()); }catch(e){}
    L.sources.forEach(s=>{ try{ s.stop(); }catch(e){} });
    try{ L.ctxIn.close(); L.ctxOut.close(); }catch(e){}
    try{ L.ws.onclose = null; L.ws.close(); }catch(e){}
  }
  resetLiveUi();
  if (note) liveStatus(note);
}
async function startLive(){
  if (live || liveBusy) return;
  if (!cfg.key){ closeAll(); openSet(); return; }
  if (!navigator.mediaDevices || !window.WebSocket){ liveStatus('❌ این مرورگر پشتیبانی نمی‌کنه.'); return; }
  liveBusy = true; $('liveBtn').disabled = true;
  liveStatus('⏳ درخواست میکروفن...');
  let stream;
  try{
    stream = await navigator.mediaDevices.getUserMedia({
      audio:{ echoCancellation:true, noiseSuppression:true, autoGainControl:true }
    });
  }catch(e){
    liveStatus('❌ اجازه‌ی میکروفن داده نشد.'); liveBusy = false; $('liveBtn').disabled = false; return;
  }

  const bases = [...new Set([cfg.base, cfg.base2].map(b=>(b||'').trim()).filter(Boolean))];
  const models = [cfg.liveModel, ...LIVE_MODELS.filter(m=>m !== cfg.liveModel)];
  let ws = null, used = '', lastErr = { msg:'آدرس سرور خالیه' };
  outer:
  for (const b of bases){
    for (const m of models){
      liveStatus('⏳ در حال اتصال (' + m + ')...');
      try{ ws = await connectOnce(b, m); used = m; break outer; }
      catch(e){ lastErr = e; if (e.kind === 'net') break; }   // خطای شبکه: امتحان مدل دیگه فایده نداره
    }
  }
  if (!ws){
    stream.getTracks().forEach(t=>t.stop());
    liveStatus('❌ وصل نشد: ' + lastErr.msg);
    liveBusy = false; $('liveBtn').disabled = false; return;
  }

  const AC = window.AudioContext || window.webkitAudioContext;
  let ctxIn; try{ ctxIn = new AC({ sampleRate:16000 }); }catch(e){ ctxIn = new AC(); }
  const ctxOut = new AC();
  try{ await ctxIn.resume(); await ctxOut.resume(); }catch(e){}
  const src = ctxIn.createMediaStreamSource(stream);
  const proc = ctxIn.createScriptProcessor(2048, 1, 1);
  const L = { ws, stream, ctxIn, ctxOut, src, proc, nextT:0, sources:new Set(), curIn:null, curOut:null, muted:false };
  live = L;

  proc.onaudioprocess = e=>{
    if (live !== L || L.muted || ws.readyState !== 1) return;
    const f = downsample(e.inputBuffer.getChannelData(0), ctxIn.sampleRate, 16000);
    ws.send(JSON.stringify({ realtimeInput:{ audio:{
      data: bufToB64(f32ToI16(f).buffer), mimeType:'audio/pcm;rate=16000' } } }));
  };
  src.connect(proc); proc.connect(ctxIn.destination);

  ws.onmessage = async ev=>{ const m = await parseMsg(ev.data); if (m && live === L) handleLive(m); };
  ws.onerror = ()=>{};
  ws.onclose = e=>{ if (live === L) stopLive('🔌 اتصال قطع شد' + (e.reason ? ': ' + e.reason : '') + '. دوباره شروع کن.'); };

  $('liveLog').innerHTML = '';
  $('liveBtn').textContent = '⏹ پایان'; $('liveBtn').classList.add('stop'); $('liveBtn').disabled = false;
  $('liveMute').style.display = 'block';
  liveStatus('🟢 وصل شد (' + used + ' / ' + cfg.voice + ') — حرف بزن' +
    (used !== cfg.liveModel ? '\n⚠️ مدل انتخابی کار نکرد، مدل جایگزین استفاده شد.' : ''));
  liveBusy = false;
}

$('bLive').onclick = ()=>{ $('ovLive').classList.add('on'); };
$('liveClose').onclick = closeAll;
$('liveBtn').onclick = ()=>{ live ? stopLive('پایان یافت. برای شروع دوباره، دکمه رو بزن.') : startLive(); };
$('liveMute').onclick = ()=>{
  if (!live) return;
  live.muted = !live.muted;
  $('liveMute').textContent = live.muted ? '🎙️ باز کردن' : '🔇 بی‌صدا';
  if (live.muted && live.ws.readyState === 1) live.ws.send(JSON.stringify({ realtimeInput:{ audioStreamEnd:true } }));
  liveStatus(live.muted ? '🔇 میکروفن بسته‌ست' : '🟢 گوش می‌دم...');
};

renderChat();
if (!cfg.key) openSet();
